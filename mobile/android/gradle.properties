# Sized to fit a 16 GB machine that's also running an IDE/emulator. The
# previous -Xmx4G -XX:MaxMetaspaceSize=1G asked the JVM to reserve ~5.5 GB
# up front, which made the daemon die with "Native memory allocation
# (mmap) failed" before the build even started. 2 GB is comfortable for a
# Flutter release build including R8.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compile daemon is a second JVM — cap it too, or it quietly
# claims another default-sized heap alongside Gradle's.
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
