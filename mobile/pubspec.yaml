name: pargig
description: "Pargig — gig-economy marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/onboarding/
    - assets/home/
