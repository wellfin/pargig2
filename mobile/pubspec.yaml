name: pargig
description: "Pargig — gig-economy marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.1.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^6.5.0
  firebase_messaging: ^16.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/onboarding/
    - assets/onboarding/tiles/
    - assets/home/
