name: pargig
description: "Pargig — gig-economy marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.1.4
  intl: ^0.20.2
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^6.5.0
  firebase_messaging: ^16.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  # `record: 4.4.4` is the last release before the package was split
  # into record_android / record_linux / record_platform_interface
  # etc. Those sub-packages are stuck mid-migration on pub and crash
  # release builds (record_linux 0.7.2 doesn't implement the abstract
  # methods from record_platform_interface 1.6.0). 4.x is a single
  # self-contained package — no Linux stub, no skew — so the
  # Android release build succeeds.
  record: 4.4.4
  path_provider: ^2.1.4
  # On-device speech-to-text for the Post Job "Voice Input" mode — the
  # mic transcribes speech straight into the description field (no audio
  # file is recorded or uploaded).
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/onboarding/
    - assets/onboarding/tiles/
    - assets/home/
