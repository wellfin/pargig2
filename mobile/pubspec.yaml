name: pargig
description: "Pargig — gig-economy marketplace mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  socket_io_client: ^3.1.4
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0
  firebase_auth: ^6.5.0
  firebase_messaging: ^16.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  # On-device text-to-speech — plays the description aloud on Job
  # Details (the play button next to "Description").
  flutter_tts: ^4.2.2
  # On-device speech recognition via the platform recogniser. Kept for the
  # manual "Speak to fill description text" fallback; it cannot run
  # alongside the recorder because it delegates to another app, which
  # takes the microphone away from us.
  speech_to_text: ^7.4.0
  # Offline speech recognition that runs INSIDE this app, so one
  # microphone session can feed both the recording and the transcript at
  # the same time. No other process, no server, no API key.
  sherpa_onnx: ^1.13.5
  # Microphone capture for Post Job's Voice Input mode. Records the
  # giver's actual voice to an .m4a which is uploaded to /jobs/voice and
  # played back verbatim on Job Details — no transcription anywhere in
  # the path, so tone, pauses and accent survive intact.
  record: ^7.1.1
  # Resolves the app's private directory for the temp .m4a that `record`
  # writes to before upload.
  path_provider: ^2.1.4
  google_maps_flutter: ^2.18.0
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash/
    - assets/onboarding/
    - assets/onboarding/tiles/
    - assets/home/
